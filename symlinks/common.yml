- clean: ["~"]

- defaults:
    link:
      create: true
      force: true

- link:
    ~/.bashrc: dots/shell/bash/.bashrc
    ~/.bash_profile: dots/shell/bash/.bash_profile
    ~/.profile: dots/shell/bash/.profile
    ~/.zshrc: dots/shell/zsh/.zshrc
    ~/.zimrc: dots/shell/zsh/.zimrc
    ~/.zlogin: dots/shell/zsh/.zlogin
    ~/.zshenv: dots/shell/zsh/.zshenv
    ~/.zprofile: dots/shell/zsh/.zprofile
    ~/.p10k.zsh: dots/shell/zsh/themes/powerlevel10k/.p10k.zsh
    ~/.config/starship.toml: dots/shell/zsh/themes/starship/starship.toml
    ~/.gitconfig: dots/git/.gitconfig
    ~/.gitconfig.inditex: dots/git/.gitconfig.inditex
    ~/.gitattributes: dots/git/.gitattributes
    ~/.gitignore_global: dots/git/.gitignore_global
    ~/.czrc: dots/git/.czrc
    ~/.vimrc: dots/editors/vim/.vimrc
    ~/.config/Code/User/settings.json: dots/editors/vscode/settings.json
    ~/.config/ghostty/config: dots/os/common/ghostty/config

- create:
    - $DOTFILES_PATH/bin/external

- shell:
    - touch $DOTFILES_PATH/dots/shell/private-stuff.sh
    - chmod +x $DOTFILES_PATH/dots/shell/private-stuff.sh
    - touch $HOME/.z
