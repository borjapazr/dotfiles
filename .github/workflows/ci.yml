name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  static-analysis:
    name: 💿 Static analysis
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout project
        uses: actions/checkout@v4

      - name: ⚪️ Set needed environment variables
        run: |
          echo "DOTFILES_PATH=$PWD" >> $GITHUB_ENV

      - name: 👀 Static analysis
        run: bash scripts/self/static_analysis

  lint:
    name: 💅 Lint
    runs-on: ubuntu-latest
    needs: static-analysis

    steps:
      - name: ⬇️ Checkout project
        uses: actions/checkout@v4

      - name: 🐿️ Setup go version
        uses: actions/setup-go@v5
        with:
          go-version: "^1.16.1"

      - name: ⚪️ Set needed environment variables
        run: |
          echo "DOTFILES_PATH=$PWD" >> $GITHUB_ENV
          echo "PATH=$PATH:$HOME/go/bin" >> $GITHUB_ENV

      - name: 📥 Install shfmt
        run: go install mvdan.cc/sh/v3/cmd/shfmt@latest

      - name: 💅 Lint bash files
        run: bash scripts/self/lint

  validate-scripts:
    name: 📜 Validate scripts
    runs-on: ubuntu-latest
    needs: static-analysis

    steps:
      - name: ⬇️ Checkout project
        uses: actions/checkout@v4

      - name: ⚪️ Set needed environment variables
        run: |
          echo "DOTFILES_PATH=$PWD" >> $GITHUB_ENV

      - name: 📜 Validate scripts
        run: bash scripts/self/validate_scripts
