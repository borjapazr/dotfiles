name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  # Every job needs it, so set it once instead of in a step per job.
  DOTFILES_PATH: ${{ github.workspace }}

jobs:
  secrets-scan:
    name: 🔍 Secrets scan
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout project
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔍 Scan for leaked secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  static-analysis:
    name: 💿 Static analysis
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout project
        uses: actions/checkout@v4

      - name: 👀 Static analysis
        run: bash commands/self/static_analysis

  lint:
    name: 💅 Lint
    runs-on: ubuntu-latest
    needs: static-analysis

    steps:
      - name: ⬇️ Checkout project
        uses: actions/checkout@v4

      - name: 🐿️ Setup go version
        uses: actions/setup-go@v5
        with:
          go-version: "^1.16.1"

      - name: ⚪️ Set needed environment variables
        run: |
          echo "PATH=$PATH:$HOME/go/bin" >> $GITHUB_ENV

      - name: 📥 Install shfmt
        run: go install mvdan.cc/sh/v3/cmd/shfmt@latest

      - name: 💅 Lint bash files
        run: bash commands/self/lint

  validate-scripts:
    name: 📜 Validate scripts
    runs-on: ubuntu-latest
    needs: static-analysis

    steps:
      - name: ⬇️ Checkout project
        uses: actions/checkout@v4

      - name: 📜 Validate scripts
        run: bash commands/self/validate_scripts

  # The regressions worth catching here were platform-specific: a GNU-only
  # `find` spelling that BSD rejects, and shell layers that had to behave the
  # same under zsh and bash. A single-OS job would have missed both.
  test:
    name: 🧪 Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: static-analysis

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: ⬇️ Checkout project
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 📥 Install bats and zsh
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            brew install bats-core
          else
            sudo apt-get update && sudo apt-get install -y bats zsh
          fi

      - name: 🧪 Run test suite
        run: bats tests
